<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Local Lens — City Events Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="index.css">
</head>
<body>

<div class="app">

  <!-- ============== Sticky Header ============== -->
  <header class="header" id="header">
    <div class="header-row">
      <h1 class="app-title">Local Lens 📍</h1>
      <div class="view-toggle" role="tablist">
        <button class="toggle-btn active" data-view="list" role="tab">List</button>
        <button class="toggle-btn" data-view="timeline" role="tab">Timeline</button>
      </div>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input
        type="search"
        class="search-input"
        id="search"
        placeholder="Search events, venues, neighborhoods..."
        autocomplete="off"
      />
    </div>

    <div class="categories" id="categories"></div>

    <div class="active-pills" id="active-pills"></div>
  </header>

  <!-- ============== Main content ============== -->
  <main class="main">
    <section id="list-view"></section>
    <section id="timeline-view" hidden></section>
  </main>

</div>

<!-- ============== Modal / Bottom sheet ============== -->
<div class="modal-backdrop" id="modal-backdrop"></div>
<aside class="bottom-sheet" id="bottom-sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheet-close" aria-label="Close">×</button>
  <div id="sheet-content"></div>
</aside>

<script src="index.js"></script>
</body>
</html>
